<!DOCTYPE html>
<html>

<head>
    <title>table creation</title>
</head>

<body>
    <h1>Birds table</h1>
    <table>
        <thead>
            <tr>
                <th rowspan="2">Animal </th>
                <th colspan="2"> Average mass [kg (lb)]></th>
                <th rowspan="2">Maximum mass [kg (lb)] </th>
                <th rowspan="2">Flighted</th>
            </tr>
            <tr>
                <th>kg</th>
                <th>lb</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ostrich</td>
                <td>104</td>
                <td>230</td>
                <td>156.8</td>
                <td>No</td>
            </tr>
            <tr>
                <td>Somali</td>
                <td>90</td>
                <td>200</td>
                <td>130</td>
                <td>No</td>
            </tr>
            <tr>
                <td>Wild turkey</td>
                <td>13.5</td>
                <td>35</td>
                <td>39</td>
                <td>yes</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td> the footer of table </td>
        </tfoot>
    </table>
</body>

</html>
